<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EPIKON - Comunidad Geek Rancagua</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <link rel="apple-touch-icon" href="mascota.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="config.js"></script>

    <style>
        :root { 
            --neon-color: #00ffcc; 
            --neon-pink: #ff0055;
            --bg-dark: #0f0f15; 
            --card-bg: #1a1a24; 
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: crosshair; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-dark); color: white; margin: 0; 
            padding-top: var(--safe-top); padding-bottom: calc(90px + var(--safe-bottom)); 
            overflow-x: hidden; text-align: center; 
        }

        /* --- BACKGROUND --- */
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0.6; }

        /* --- HEADER --- */
        header { 
            background-size: cover; background-position: center; height: 40vh; 
            display: flex; justify-content: center; align-items: center; position: relative; 
            transition: background-image 1s; margin-bottom: 20px;
        }
        header::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.3), var(--bg-dark)); }
        .main-logo { width: 70%; max-width: 350px; position:relative; z-index:1; animation: float 4s infinite; opacity:0; transition: opacity 0.5s; }
        .main-logo.loaded { opacity: 1; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* --- EVENTO DESTACADO --- */
        .event-hero {
            background: linear-gradient(180deg, #1a1a24 0%, #0f0f15 100%);
            border: 2px solid var(--neon-pink); border-radius: 20px;
            overflow: hidden; margin-bottom: 40px; text-align: left;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2); position: relative;
        }
        .event-flyer { 
            width: 100%; 
            height: auto; 
            display: block; 
            max-height: 600px; 
            object-fit: contain; 
        }
        .event-details { padding: 20px; }
        .event-title { color: var(--neon-color); font-size: 1.8rem; margin: 0 0 10px 0; text-transform: uppercase; font-weight: 800; line-height: 1.1; }
        .event-info { font-size: 0.95rem; color: #ddd; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .event-info i { color: var(--neon-pink); width: 20px; text-align: center; margin-right: 5px; }
        .event-schedule { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; font-size: 0.85rem; color: #aaa; margin-bottom: 15px; border-left: 3px solid var(--neon-color); }
        .event-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-event { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; transition: 0.3s; text-decoration: none; color: white;}
        .btn-cal { background: var(--neon-color); color: #000; }
        .btn-map { background: #333; border: 1px solid #555; }
        .btn-share { background: var(--neon-pink); color: white; }
        .btn-event:hover { filter: brightness(1.2); transform: translateY(-2px); }

        /* --- GENERAL & UTILS --- */
        .section-title { color: var(--neon-color); font-size: 1.5rem; margin: 40px 0 20px; text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #333; padding-bottom: 10px; display: inline-block; position: relative; }
        .section-title:hover { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-color); }
        .grid-base { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; min-height: 100px; }
        .section-container { padding: 0 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #333; flex: 0 1 300px; width: 100%; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--neon-color); transform: translateY(-5px); }
        .card-thumb { width: 100%; height: 160px; object-fit: cover; }
        .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .btn-action { display: block; width: 100%; padding: 10px; border: 1px solid var(--neon-color); color: var(--neon-color); text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; cursor: pointer; background: transparent; }
        .btn-action:hover { background: var(--neon-color); color: black; }
        .filter-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { background: transparent; border: 1px solid #555; color: #aaa; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .filter-btn.active { border-color: var(--neon-color); color: var(--neon-color); background: rgba(0,255,204,0.1); }
        
        /* --- ESTILO DE EQUIPO --- */
        .staff-photo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--neon-pink); margin-bottom: 10px; }
        .staff-role { color: #aaa; font-size: 0.85rem; margin-bottom: 10px; font-style: italic; }

        /* --- GALERÍA MASONRY --- */
        .gallery-grid { columns: 2 200px; column-gap: 15px; }
        .gallery-item { margin-bottom: 15px; break-inside: avoid; border-radius: 12px; overflow: hidden; border: 1px solid #333; cursor: zoom-in; transition: transform 0.2s; }
        .gallery-item:hover { transform: scale(1.02); border-color: var(--neon-color); }
        .gallery-item img { width: 100%; display: block; }
        
        /* LIGHTBOX */
        .lightbox { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; display:none; justify-content:center; align-items:center; backdrop-filter:blur(5px); }
        .lightbox img { max-width:90%; max-height:90%; border-radius:10px; box-shadow:0 0 30px var(--neon-color); }
        .lightbox-close { position:absolute; top:20px; right:20px; color:white; font-size:2rem; cursor:pointer; }

        /* --- MASCOTA GUÍA --- */
        .mascot-container {
            position: fixed; bottom: 150px; right: 15px; z-index: 1900;
            display: flex; flex-direction: column; align-items: flex-end;
            pointer-events: none; transition: transform 0.3s ease;
        }
        .mascot-img {
            width: 120px; height: auto; animation: floatMascot 6s ease-in-out infinite;
            pointer-events: auto; cursor: help;
        }
        .mascot-bubble {
            background: var(--card-bg); border: 2px solid var(--neon-color); color: white;
            padding: 10px 15px; border-radius: 15px; border-bottom-right-radius: 0;
            margin-bottom: 10px; max-width: 200px; font-size: 0.85rem; text-align: right;
            opacity: 0; transform: translateY(20px); transition: all 0.5s ease;
            pointer-events: auto; box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            position: relative;
        }
        .mascot-bubble.show { opacity: 1; transform: translateY(0); }
        
        /* Botón cerrar mascota */
        .mascot-close {
            position: absolute; top: -10px; right: -10px;
            background: var(--neon-pink); color: white; width: 20px; height: 20px;
            border-radius: 50%; font-size: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: none; font-weight: bold;
        }
        
        /* Botón para restaurar mascota (Ahora con imagen) */
        .mascot-restore {
            position: fixed; bottom: 150px; right: 10px; z-index: 1900;
            width: 50px; height: 50px; 
            background: var(--card-bg); border: 2px solid var(--neon-color);
            border-radius: 50%; display: none; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 15px var(--neon-color);
            overflow: hidden; padding: 0;
        }
        .mascot-restore img {
            width: 100%; height: 100%; object-fit: cover;
        }

        @keyframes floatMascot { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }

        /* --- MUSIC & INSTALL --- */
        .music-player { 
            position: fixed; bottom: 85px; right: 20px; z-index: 90; 
            background: rgba(0,0,0,0.8); border: 1px solid var(--neon-color); border-radius: 50px; 
            padding: 10px; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(5px); 
            transition: width 0.3s, padding 0.3s; overflow: hidden; max-width: 300px;
        }
        .music-disc { font-size: 1.5rem; animation: spin 3s linear infinite; animation-play-state: paused; min-width: 24px;}
        .music-player.playing .music-disc { animation-play-state: running; }
        
        .music-player.minimized { width: 45px; padding: 10px; justify-content: center; }
        .music-player.minimized span, 
        .music-player.minimized #play-icon,
        .music-player.minimized .music-minimize-btn { display: none; }
        
        .music-minimize-btn {
            background: none; border: none; color: #aaa; cursor: pointer; font-size: 0.8rem; margin-left: 5px;
        }
        .music-minimize-btn:hover { color: white; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .install-btn { display: none; background: var(--neon-pink); color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; margin: 20px auto; animation: pulse 2s infinite; cursor: pointer; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 15px var(--neon-pink); } 100% { transform: scale(1); } }

        /* --- COMUNIDAD --- */
        .insta-card { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid #333; flex: 0 1 200px; min-width: 150px; aspect-ratio: 1/1; background: #000; }
        .insta-img, .insta-video { width: 100%; height: 100%; object-fit: cover; }
        .insta-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; opacity:0; transition:0.3s; }
        .insta-card:hover .insta-overlay { opacity:1; }
        .sorteo-box { background: linear-gradient(135deg, #2a0a38, #0f0f15); border: 2px solid var(--neon-color); border-radius: 20px; padding: 20px; margin: 40px auto; max-width: 600px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 20px; }
        .sorteo-timer { font-family: monospace; font-size: 1.5rem; color: var(--neon-color); font-weight: bold; margin: 15px 0; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(26, 26, 36, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + var(--safe-bottom)); border-top: 1px solid #333; z-index: 1000; }
        .nav-item { background: none; border: none; color: #888; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 25%; }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { color: var(--neon-color); text-shadow: 0 0 10px var(--neon-color); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <header id="main-header"><img src="" class="main-logo" id="dynamic-logo" alt="Logo Epikon"></header>

    <div id="mascot-container" class="mascot-container" style="display: none;">
        <div id="mascot-bubble" class="mascot-bubble">
            <span id="mascot-text">...</span>
            <button class="mascot-close" onclick="toggleMascot(false)">×</button>
        </div>
        <img id="mascot-img" class="mascot-img" src="" alt="Guía Epikon">
    </div>
    
    <button id="mascot-restore" class="mascot-restore" onclick="toggleMascot(true)">
        <img id="mascot-restore-img" src="" alt="Mascota">
    </button>

    <div class="music-player" id="music-player" onclick="toggleMusic(event)">
        <i class="fas fa-compact-disc music-disc" style="color:var(--neon-color)"></i>
        <span style="font-size:0.8rem; font-weight:bold;">LOFI</span>
        <i class="fas fa-play" id="play-icon" style="font-size:0.8rem; margin-left:5px;"></i>
        <button class="music-minimize-btn" onclick="toggleMusicSize(event)"><i class="fas fa-compress-alt"></i></button>
        <audio id="audio-stream" preload="none"></audio>
    </div>

    <button id="btn-install" class="install-btn"><i class="fas fa-download"></i> INSTALAR APP</button>

    <div class="lightbox" id="lightbox" onclick="this.style.display='none'">
        <div class="lightbox-close">&times;</div>
        <img id="lightbox-img" src="">
    </div>

    <div id="tab-home" class="tab-content active section-container">
        <div id="hero-event-container"></div>
        <h2 class="section-title">🎁 Juegos Gratis</h2>
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterGames('all', this)">TODOS</button>
            <button class="filter-btn" onclick="filterGames('steam', this)">STEAM</button>
            <button class="filter-btn" onclick="filterGames('epic', this)">EPIC</button>
        </div>
        <div id="games-container" class="grid-base"><p style="color:#888">Buscando regalos...</p></div>
        <h2 class="section-title">📅 Calendario Anime</h2>
        <div id="anime-calendar-container" class="grid-base"><p style="color:#888">Cargando calendario...</p></div>
        <div style="text-align:center; width:100%; margin-top:20px;">
            <button id="btn-expand-anime" style="display:none; background:transparent; border:1px solid var(--neon-color); color:var(--neon-color); padding:10px 20px; border-radius:20px; cursor:pointer;" onclick="expandAnimeCalendar()">VER MÁS ANIMES</button>
        </div>
        <h2 class="section-title">🎎 Noticias Anime</h2>
        <div id="anime-news-container" class="grid-base"><p style="color:#888">Leyendo noticias...</p></div>
        <h2 class="section-title">📰 Radar Geek</h2>
        <div id="news-container" class="grid-base"><p style="color:#888">Escaneando redes...</p></div>
    </div>

    <div id="tab-social" class="tab-content section-container">
        <h2 class="section-title" id="team-title" style="display:none;">🛡️ Staff Epikon</h2>
        <div id="team-grid" class="grid-base" style="margin-bottom:40px;"></div>
        <div id="community-info-section"></div>
        <h2 class="section-title">📸 Feed Instagram</h2>
        <div id="insta-feed" class="grid-base"></div>
        <div id="sorteo-section"></div>
        <h2 class="section-title">👥 Cosplayers</h2>
        <div id="cosplay-grid" class="grid-base"></div>
    </div>

    <div id="tab-gallery" class="tab-content section-container">
        <h2 class="section-title">📸 Galería Epikon</h2>
        <div class="filter-container">
            <button class="filter-btn active" onclick="loadGallery('actual', this)">EVENTO ACTUAL</button>
            <button class="filter-btn" onclick="loadGallery('anterior', this)">PASADOS</button>
        </div>
        <div id="full-gallery-grid" class="gallery-grid"></div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home', this)"><i class="fas fa-home"></i><span>INICIO</span></button>
        <button class="nav-item" onclick="switchTab('social', this)"><i class="fas fa-users"></i><span>COMUNIDAD</span></button>
        <button class="nav-item" onclick="switchTab('gallery', this)"><i class="fas fa-images"></i><span>GALERÍA</span></button>
        <button class="nav-item" onclick="openInstagram()"><i class="fab fa-instagram"></i><span>INSTA</span></button>
    </nav>

    <script>
        let animeOcultosGlobal = [];
        let allLoadedGames = [];
        let deferredPrompt;

        window.addEventListener('load', () => {
            if (typeof CONFIG === 'undefined') { console.error("Error Config"); return; }
            initApp();
            initParticles();
        });

        function initApp() {
            // --- CÓDIGO DE INSTALACIÓN (SERVICE WORKER) ---
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker Registrado'))
                    .catch(err => console.error('Error SW:', err));
            }
            // ---------------------------------------------

            const logoEl = document.getElementById('dynamic-logo');
            if(CONFIG.imagenes && CONFIG.imagenes.logo) logoEl.src = CONFIG.imagenes.logo;
            logoEl.onload = () => logoEl.classList.add('loaded');
            if(CONFIG.musica && CONFIG.musica.streamUrl) document.getElementById('audio-stream').src = CONFIG.musica.streamUrl;

            loadHeroEvent();
            initBackgroundSlider();
            loadAllContent();
            loadSocialContent();
            loadGallery('actual'); 
            initMascot(); 
        }

        // --- MASCOTA GUÍA ---
        let mascotInterval;
        function initMascot() {
            if(!CONFIG.mascota || !CONFIG.mascota.activo || !CONFIG.mascota.imagenPng) return;

            const container = document.getElementById('mascot-container');
            const img = document.getElementById('mascot-img');
            const restoreImg = document.getElementById('mascot-restore-img'); 
            
            const bubble = document.getElementById('mascot-bubble');
            const textSpan = document.getElementById('mascot-text');
            const frases = CONFIG.mascota.frases || ["¡Hola!"];
            let fraseIdx = 0;

            img.src = CONFIG.mascota.imagenPng;
            if(restoreImg) restoreImg.src = CONFIG.mascota.imagenPng;

            container.style.display = 'flex';

            const cyclePhrase = () => {
                if(container.style.display === 'none') return;
                bubble.classList.remove('show'); 
                setTimeout(() => {
                    fraseIdx = (fraseIdx + 1) % frases.length;
                    textSpan.innerText = frases[fraseIdx];
                    bubble.classList.add('show'); 
                }, 1000); 
            };

            textSpan.innerText = frases[0];
            setTimeout(()=> bubble.classList.add('show'), 1000);

            if(frases.length > 1) {
                mascotInterval = setInterval(cyclePhrase, CONFIG.mascota.tiempoEntreFrases || 8000);
            }
        }

        function toggleMascot(show) {
            const container = document.getElementById('mascot-container');
            const restoreBtn = document.getElementById('mascot-restore');
            if(show) {
                container.style.display = 'flex';
                restoreBtn.style.display = 'none';
            } else {
                container.style.display = 'none';
                restoreBtn.style.display = 'flex';
            }
        }

        // --- GALERÍA ---
        function loadGallery(type, btn) {
            if(btn) {
                document.querySelectorAll('#tab-gallery .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            const container = document.getElementById('full-gallery-grid');
            if(!CONFIG.social.galeriaCompleta || !CONFIG.social.galeriaCompleta[type]) {
                container.innerHTML = "<p>No hay fotos disponibles.</p>";
                return;
            }
            const photos = CONFIG.social.galeriaCompleta[type];
            container.innerHTML = photos.map(url => `
                <div class="gallery-item" onclick="openLightbox('${url}')">
                    <img src="${url}" loading="lazy" alt="Foto Evento">
                </div>
            `).join('');
        }

        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').style.display = 'flex';
        }

        // --- EVENTO ---
        function loadHeroEvent() {
            const container = document.getElementById('hero-event-container');
            if(!CONFIG.evento || !CONFIG.evento.activo) { container.style.display = 'none'; return; }
            const e = CONFIG.evento;
            const flyerHtml = e.flyer ? `<img src="${e.flyer}" class="event-flyer" onerror="this.style.display='none'">` : '';
            container.innerHTML = `
                <div class="event-hero">${flyerHtml}
                    <div class="event-details"><h2 class="event-title">${e.titulo}</h2>
                        <div class="event-info"><span><i class="fas fa-map-marker-alt"></i> ${e.ubicacion}</span><span><i class="far fa-calendar-alt"></i> ${new Date(e.fechaInicio).toLocaleDateString()}</span><span><i class="far fa-clock"></i> ${new Date(e.fechaInicio).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} hrs</span></div>
                        <p style="color:#ccc; margin-bottom:15px; line-height:1.4;">${e.descripcion}</p>
                        ${e.cronograma ? `<div class="event-schedule"><i class="fas fa-list-ul"></i> ${e.cronograma}</div>` : ''}
                        <div class="event-actions"><button class="btn-event btn-cal" onclick="addToCalendar()"><i class="far fa-calendar-plus"></i> AGENDAR</button>${e.mapaLink ? `<a href="${e.mapaLink}" target="_blank" class="btn-event btn-map"><i class="fas fa-map"></i> MAPA</a>` : ''}<button class="btn-event btn-share" onclick="shareEvent()"><i class="fas fa-share-alt"></i> COMPARTIR</button></div>
                    </div>
                </div>`;
        }
        function shareEvent() { const e = CONFIG.evento; if (navigator.share) { navigator.share({ title: e.titulo, text: `¡Nos vemos en ${e.titulo}!`, url: window.location.href }); } else { alert("Link copiado"); } }
        function addToCalendar() { const e = CONFIG.evento; if(!e) return; const start = e.fechaInicio.replace(/-|:/g, ''); const end = e.fechaFin.replace(/-|:/g, ''); window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.titulo)}&dates=${start}/${end}&details=${encodeURIComponent(e.descripcion)}&location=${encodeURIComponent(e.ubicacion)}`, '_blank'); }

        // --- UI FUNCS ---
        function switchTab(t, btn) { document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active'); btn.classList.add('active'); window.scrollTo({top:0, behavior:'smooth'}); }
        function openInstagram() { window.open(CONFIG.redes.instagram || '#', '_blank'); }
        
        function toggleMusic(event) {
            if(event && event.target.closest('.music-minimize-btn')) return;

            const audio = document.getElementById('audio-stream');
            const player = document.getElementById('music-player');
            const icon = document.getElementById('play-icon');
            
            if(player.classList.contains('minimized')) {
                toggleMusicSize(event);
                return;
            }

            if (audio.paused) { audio.play(); player.classList.add('playing'); icon.classList.replace('fa-play', 'fa-pause'); } 
            else { audio.pause(); player.classList.remove('playing'); icon.classList.replace('fa-pause', 'fa-play'); }
        }

        function toggleMusicSize(event) {
            if(event) event.stopPropagation(); 
            const player = document.getElementById('music-player');
            player.classList.toggle('minimized');
        }

        // --- CONTENT ---
        async function loadAllContent() { await loadGames(); loadAnimeCalendar(); loadRSSNews('https://somoskudasai.com/feed/', 'anime-news-container'); loadRSSNews('https://latam.ign.com/feed.xml', 'news-container'); }
        
        async function loadGames() {
            try {
                // VOLVIMOS AL MÉTODO ORIGINAL (GamerPower con Proxy CodeTabs)
                // Si el celular bloquea esto, deberías ver "Buscando regalos..." o error en consola, pero no rompe la página.
                const proxyUrl = 'https://api.codetabs.com/v1/proxy?quest=';
                const targetUrl = 'https://www.gamerpower.com/api/giveaways?platform=pc&type=game&sort-by=popularity';
                
                const r = await fetch(proxyUrl + encodeURIComponent(targetUrl));
                if (!r.ok) throw new Error("Error Proxy");
                
                const d = await r.json();
                allLoadedGames = d; 
                renderGames(d.slice(0, 4));
            } catch(e) { 
                // Mensaje simple si falla, sin romper nada
                document.getElementById('games-container').innerHTML = "<p>Intenta recargar la página.</p>"; 
            }
        }

        function renderGames(games) { document.getElementById('games-container').innerHTML = games.map(g => `<div class="card"><img src="${g.image}" class="card-thumb" onerror="this.src='https://placehold.co/600x400/1a1a24/00ffcc?text=Game'"><div class="card-content"><div style="font-weight:bold; margin-bottom:10px;">${g.title}</div><div style="font-size:0.8rem; color:#aaa; margin-bottom:5px;">${g.platforms}</div><a href="${g.open_giveaway_url}" target="_blank" class="btn-action">GRATIS</a></div></div>`).join(''); }
        function filterGames(type, btn) { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderGames(type === 'all' ? allLoadedGames.slice(0,4) : allLoadedGames.filter(g => g.platforms.toLowerCase().includes(type) || g.title.toLowerCase().includes(type)).slice(0,4)); }

        async function loadAnimeCalendar() { try { const r = await fetch('https://api.jikan.moe/v4/seasons/now?limit=20'); const d = await r.json(); if(!d.data) return; const primeros = d.data.slice(0, 4); animeOcultosGlobal = d.data.slice(4); document.getElementById('anime-calendar-container').innerHTML = generateAnimeHTML(primeros); if(animeOcultosGlobal.length > 0) document.getElementById('btn-expand-anime').style.display = 'inline-block'; } catch(e){} }
        function expandAnimeCalendar() { document.getElementById('anime-calendar-container').innerHTML += generateAnimeHTML(animeOcultosGlobal); document.getElementById('btn-expand-anime').style.display = 'none'; }
        function generateAnimeHTML(lista) { const dias = { "Mondays": "Lunes", "Tuesdays": "Martes", "Wednesdays": "Miércoles", "Thursdays": "Jueves", "Fridays": "Viernes", "Saturdays": "Sábados", "Sundays": "Domingos" }; return lista.map(a => `<div class="card"><img src="${a.images.jpg.large_image_url}" class="card-thumb"><div class="card-content"><div style="font-weight:bold; margin-bottom:5px;">${a.title}</div><div style="background:#333; padding:4px 10px; border-radius:20px; font-size:0.8rem; display:inline-block;"><i class="far fa-clock"></i> ${dias[a.broadcast.day] || 'Por definir'}</div><a href="${a.url}" target="_blank" class="btn-action">INFO</a></div></div>`).join(''); }
        async function loadRSSNews(u,id) { try { const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(u)); const d = await r.json(); document.getElementById(id).innerHTML = d.items.slice(0,3).map(i=> { let img = i.thumbnail || (i.description.match(/<img[^>]+src="([^">]+)"/) || [])[1] || 'https://placehold.co/600x400/1a1a24/00ffcc?text=News'; return `<div class="card"><img src="${img}" class="card-thumb"><div class="card-content"><div style="font-weight:bold;margin-bottom:10px;">${i.title}</div><a href="${i.link}" target="_blank" class="btn-action">LEER</a></div></div>`; }).join(''); } catch(e){} }

        function startTimer(f) { const end = new Date(f).getTime(); setInterval(()=>{ const d = end - new Date().getTime(); if(d<0) return; const days=Math.floor(d/(1000*60*60*24)); const hours=Math.floor((d%(1000*60*60*24))/(1000*60*60)); const mins=Math.floor((d%(1000*60*60))/(1000*60)); const t=document.getElementById('timer'); if(t) t.innerText=`${days}d ${hours}h ${mins}m`; },1000); }
        function initBackgroundSlider() { const bgs = (CONFIG.imagenes && CONFIG.imagenes.fondos) ? CONFIG.imagenes.fondos : []; let idx=0; const h=document.getElementById('main-header'); if(bgs.length>0) { h.style.backgroundImage=`url('${bgs[0]}')`; if(bgs.length>1) setInterval(()=>{ idx=(idx+1)%bgs.length; h.style.backgroundImage=`url('${bgs[idx]}')`; }, 6000); } }
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; const btn = document.getElementById('btn-install'); btn.style.display = 'block'; btn.addEventListener('click', () => { deferredPrompt.prompt(); deferredPrompt.userChoice.then((choice) => { if (choice.outcome === 'accepted') btn.style.display = 'none'; deferredPrompt = null; }); }); });
        function initParticles() { const canvas = document.getElementById('particles-canvas'); const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight; let particlesArray = []; class Particle { constructor(){ this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.size=Math.random()*2; this.speedY=Math.random()*1; } update(){ this.y-=this.speedY; if(this.y<0){ this.y=canvas.height; this.x=Math.random()*canvas.width; } } draw(){ ctx.fillStyle='rgba(0, 255, 204, 0.5)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); } } for(let i=0; i<50; i++) particlesArray.push(new Particle()); function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); for(let i=0; i<particlesArray.length; i++){ particlesArray[i].update(); particlesArray[i].draw(); } requestAnimationFrame(animate); } animate(); window.addEventListener('resize', ()=>{ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }); }
    </script>
</body>
</html>
